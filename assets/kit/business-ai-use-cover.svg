<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">What counts as use?</title><desc id="desc">National BTOS business-use answers:Yes24.2percent, No61.9percent, Do not know13.9percent. Reference5–18October2026. A weighted business response, not a share of work performed.</desc><style>@font-face{font-family:display;src:url(../fonts/Anton-Regular.ttf)}@font-face{font-family:body;src:url(../fonts/Archivo-Variable.ttf)}@font-face{font-family:mono;src:url(../fonts/SpaceMono-Regular.ttf)}</style><rect x="0" y="0" width="1200" height="630" fill="#0c1114"/><text x="55" y="35" dominant-baseline="text-before-edge" font-family="mono" font-size="22" fill="#b8c1c5">AI/MAXXI · SOURCE READING</text><text x="55" y="82" dominant-baseline="text-before-edge" font-family="display" font-size="72" fill="#f3f0e8">WHAT COUNTS AS USE?</text><text x="55" y="184" dominant-baseline="text-before-edge" font-family="body" font-size="32" fill="#b8c1c5">Business use in any business function</text><text x="55" y="267" dominant-baseline="text-before-edge" font-family="body" font-size="30" fill="#f3f0e8">Yes</text><text x="55" y="320" dominant-baseline="text-before-edge" font-family="display" font-size="82" fill="#ff6b35">24.2%</text><text x="55" y="425" dominant-baseline="text-before-edge" font-family="mono" font-size="26" fill="#b8c1c5">SE 0.61 pp</text><text x="440" y="267" dominant-baseline="text-before-edge" font-family="body" font-size="30" fill="#f3f0e8">No</text><text x="440" y="320" dominant-baseline="text-before-edge" font-family="display" font-size="82" fill="#f3f0e8">61.9%</text><text x="440" y="425" dominant-baseline="text-before-edge" font-family="mono" font-size="26" fill="#b8c1c5">SE 0.78 pp</text><text x="825" y="267" dominant-baseline="text-before-edge" font-family="body" font-size="30" fill="#f3f0e8">Do not know</text><text x="825" y="320" dominant-baseline="text-before-edge" font-family="display" font-size="82" fill="#f3f0e8">13.9%</text><text x="825" y="425" dominant-baseline="text-before-edge" font-family="mono" font-size="26" fill="#b8c1c5">SE 0.27 pp</text><rect x="55" y="488" width="1090" height="2" fill="#43535c"/><text x="55" y="515" dominant-baseline="text-before-edge" font-family="body" font-size="27" fill="#b8c1c5">Reference 5–18 Oct 2026 · Released 5 Nov · Census BTOS</text><text x="55" y="563" dominant-baseline="text-before-edge" font-family="body" font-size="30" fill="#f3f0e8">Weighted business responses. Work performed unmeasured.</text></svg>
