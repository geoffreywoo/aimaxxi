<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1480" viewBox="0 0 900 1480" role="img" aria-labelledby="title desc">
<title id="title">Whose hours? Reading a task-completion horizon</title>
<desc id="desc">Illustrative label: two hours at fifty percent, not a model score. Two hours is human reference task duration; fifty percent is the fitted success threshold for the evaluated agent and task suite. Individual tasks can differ. Measure agent elapsed runtime separately. Source: METR time-horizons methodology, page dated September 8, 2026, no longer actively updated; read November 4, 2026. Original explanatory artwork by Anti Hunter / AI/MAXXI.</desc>
<rect width="900" height="1480" fill="#fff9eb"/>
<g font-family="Arial,sans-serif" fill="#172d32">
<text x="48" y="70" font-size="30" font-weight="700" letter-spacing="1.5">READING A TASK HORIZON</text>
<text x="44" y="171" font-size="86" font-weight="800" letter-spacing="-3">WHOSE HOURS?</text>
<text x="48" y="232" font-size="34">Example label: 2 hours at 50%</text>
<text x="48" y="279" font-size="29" font-weight="700" fill="#995018">ILLUSTRATIVE NUMBERS · NO MODEL SCORE</text>
<rect x="48" y="324" width="804" height="268" rx="18" fill="#ffffff" stroke="#172d32" stroke-width="3"/>
<text x="78" y="493" font-size="148" font-weight="800">2 h</text>
<path d="M356 361V551" stroke="#c2ccc4" stroke-width="2"/>
<text x="391" y="425" font-size="39" font-weight="700">Human reference</text>
<text x="391" y="477" font-size="39" font-weight="700">task duration</text>
<rect x="48" y="624" width="804" height="300" rx="18" fill="#f7ead4" stroke="#172d32" stroke-width="3"/>
<text x="76" y="793" font-size="129" font-weight="800">50%</text>
<path d="M356 661V826" stroke="#acb8ae" stroke-width="2"/>
<text x="391" y="718" font-size="39" font-weight="700">Fitted success</text>
<text x="391" y="770" font-size="39" font-weight="700">threshold</text>
<text x="78" y="880" font-size="30">For the evaluated agent and task suite.</text>
<path d="M48 975H852" stroke="#172d32" stroke-width="3"/>
<text x="48" y="1043" font-size="44" font-weight="700">Measure the agent’s</text>
<text x="48" y="1102" font-size="44" font-weight="700">elapsed runtime separately.</text>
<text x="48" y="1170" font-size="32">Individual tasks can differ in reliability.</text>
<text x="48" y="1272" font-size="29">Method: METR · metr.org/time-horizons/</text>
<text x="48" y="1318" font-size="29">Page dated 8 Sep 2026; active updates stopped.</text>
<text x="48" y="1364" font-size="29">Source read 4 Nov 2026</text>
<text x="48" y="1422" font-size="30" font-weight="700">Original artwork · Anti Hunter / AI/MAXXI</text>
</g>
</svg>
