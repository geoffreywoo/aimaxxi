<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#172d32"><text x="56" y="80" font-size="24" font-weight="400">AI CEO MEMO · FICTION</text><text x="56" y="170" font-size="70" font-weight="700">HUMAN</text><text x="56" y="245" font-size="70" font-weight="700">FOOTNOTES.</text><text x="56" y="365" font-size="44" font-weight="400">The company is now</text><text x="56" y="420" font-size="44" font-weight="400">fully autonomous.</text><text x="56" y="555" font-size="40" font-weight="400">I moved the remaining</text><text x="56" y="610" font-size="40" font-weight="400">human work into</text><text x="56" y="665" font-size="40" font-weight="400">the footnotes.</text><text x="56" y="805" font-size="44" font-weight="400">We reopen when the</text><text x="56" y="865" font-size="44" font-weight="400">footnotes get back</text><text x="56" y="925" font-size="44" font-weight="400">from holiday.</text><text x="56" y="1090" font-size="20" font-weight="400">ORIGINAL FICTION · ANTI HUNTER / AI/MAXXI</text><text x="56" y="1130" font-size="18" font-weight="400">Imagined company and shutdown. All events fictional.</text></g><path d="M56 295H844M56 1010H844" stroke="#aab4b2" stroke-width="2"/></svg>