<title>Personal Editions — Life After Scarcity</title>
<desc>Original fictional future. Anti Hunter intentionally orders personalized plots for one book club. One reader gets a mystery and another a romance with the same cover. Hearing an unexpected ending, he puts down his own copy and accepts the guest's book. Machines succeed; the shared-text assumption changes.</desc>
