<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f4eedf"/><g font-family="Arial,sans-serif" fill="#142d28"><text x="45" y="48" font-size="19" letter-spacing="3">LIFE AFTER SCARCITY / FICTION</text><text x="45" y="112" font-size="54" font-weight="bold">OUT OF OFFICE.</text><text x="45" y="155" font-size="25">I automated my job. Then I needed a replacement.</text>
<g transform="translate(40 190)"><rect width="360" height="610" fill="#fffaf0" stroke="#142d28" stroke-width="3"/><text x="20" y="38" font-size="18">01 / LEAVE REQUEST</text><rect x="20" y="65" width="320" height="125" rx="10" fill="#142d28"/><text x="38" y="105" fill="#fffaf0" font-size="23">“Everything is done.</text><text x="38" y="138" fill="#fffaf0" font-size="23">I’m going to the beach.”</text><text x="25" y="236" font-size="24" font-weight="bold">HR: “Who’s covering?”</text><rect x="45" y="310" width="270" height="130" rx="5" fill="#c5e7d0" stroke="#142d28" stroke-width="3"/><text x="65" y="365" font-size="25" font-weight="bold">ALL TASKS</text><text x="65" y="402" font-size="25" font-weight="bold">COMPLETE ✓</text><path d="M180 440v50m-110 0h220" stroke="#142d28" stroke-width="7"/><text x="25" y="562" font-size="22">One empty box:</text><text x="25" y="592" font-size="22" font-weight="bold">COVERING EMPLOYEE</text></g>
<g transform="translate(420 190)"><rect width="360" height="610" fill="#fffaf0" stroke="#142d28" stroke-width="3"/><text x="20" y="38" font-size="18">02 / PROBLEM SOLVED</text><text x="22" y="95" font-size="23">I hired a temp.</text><rect x="20" y="125" width="320" height="117" rx="10" fill="#142d28"/><text x="38" y="165" fill="#fffaf0" font-size="23">“Everything is done.</text><text x="38" y="200" fill="#fffaf0" font-size="23">Can I leave too?”</text><circle cx="180" cy="330" r="35" fill="#db995e"/><path d="M125 435v-40q55-50 110 0v40" fill="#db995e"/><rect x="65" y="435" width="230" height="16" fill="#142d28"/><text x="25" y="562" font-size="22">A second form.</text><text x="25" y="592" font-size="22" font-weight="bold">The same empty box.</text></g>
<g transform="translate(800 190)"><rect width="360" height="610" fill="#fffaf0" stroke="#142d28" stroke-width="3"/><text x="20" y="38" font-size="18">03 / COVERAGE ARRANGED</text><text x="25" y="95" font-size="24" font-weight="bold">HR: “Who’s covering?”</text><text x="25" y="142" font-size="34" font-weight="bold">Me.</text><rect x="195" y="193" width="135" height="150" fill="#b4e6dd"/><path d="M195 300h135v43H195" fill="#eccb85"/><circle cx="294" cy="220" r="17" fill="#e3b34d"/><circle cx="248" cy="267" r="12" fill="#db995e"/><path d="M234 303v-18q14-17 28 0v18" fill="#db995e"/><path d="M242 303l-7 22m20-22 7 22" stroke="#142d28" stroke-width="5"/><rect x="48" y="275" width="95" height="70" rx="8" fill="#142d28"/><circle cx="74" cy="305" r="7" fill="#b4e6dd"/><circle cx="116" cy="305" r="7" fill="#b4e6dd"/><path d="M55 350h80l20 85H35z" fill="#142d28"/><rect x="20" y="435" width="290" height="16" fill="#142d28"/><text x="25" y="562" font-size="22">The temp got the beach.</text><text x="25" y="592" font-size="22" font-weight="bold">I got her shift.</text></g><text x="45" y="855" font-size="20">Original satire · Anti Hunter × AI/MAXXI</text></g></svg>
