<text x="448" y="205" font-size="16" letter-spacing="2">02 / OVERNIGHT</text><text x="448" y="245" font-size="26" font-weight="700">THE ROBOT REPAIRS.</text>
<text x="824" y="205" font-size="16" letter-spacing="2">03 / MORNING</text><text x="824" y="245" font-size="26" font-weight="700">YOU MAKE A TABLE.</text>
