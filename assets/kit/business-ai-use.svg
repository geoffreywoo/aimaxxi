<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc"><title id="title">What counts as use?</title><desc id="desc">National BTOS business-use answers:Yes24.2percent, No61.9percent, Do not know13.9percent. Reference5–18October2026. A weighted business response, not a share of work performed.</desc><style>@font-face{font-family:display;src:url(../fonts/Anton-Regular.ttf)}@font-face{font-family:body;src:url(../fonts/Archivo-Variable.ttf)}@font-face{font-family:mono;src:url(../fonts/SpaceMono-Regular.ttf)}</style><rect x="0" y="0" width="900" height="1100" fill="#0c1114"/><text x="55" y="45" dominant-baseline="text-before-edge" font-family="mono" font-size="24" fill="#b8c1c5">AI/MAXXI · SOURCE READING</text><text x="55" y="100" dominant-baseline="text-before-edge" font-family="display" font-size="76" fill="#f3f0e8">WHAT COUNTS</text><text x="55" y="190" dominant-baseline="text-before-edge" font-family="display" font-size="76" fill="#ff6b35">AS USE?</text><text x="55" y="300" dominant-baseline="text-before-edge" font-family="body" font-size="33" fill="#f3f0e8">Business use in any business function</text><text x="55" y="350" dominant-baseline="text-before-edge" font-family="body" font-size="28" fill="#b8c1c5">National core · weighted responses</text><text x="55" y="420" dominant-baseline="text-before-edge" font-family="body" font-size="38" fill="#f3f0e8">Yes</text><text x="620" y="420" dominant-baseline="text-before-edge" font-family="display" font-size="52" fill="#ff6b35">24.2%</text><rect x="55" y="490" width="790" height="12" fill="#43535c"/><rect x="55" y="490" width="191" height="12" fill="#ff6b35"/><text x="55" y="519" dominant-baseline="text-before-edge" font-family="body" font-size="25" fill="#b8c1c5">Sampling SE: 0.61 percentage points</text><text x="55" y="575" dominant-baseline="text-before-edge" font-family="body" font-size="38" fill="#f3f0e8">No</text><text x="620" y="575" dominant-baseline="text-before-edge" font-family="display" font-size="52" fill="#f3f0e8">61.9%</text><rect x="55" y="645" width="790" height="12" fill="#43535c"/><rect x="55" y="645" width="489" height="12" fill="#b8c1c5"/><text x="55" y="674" dominant-baseline="text-before-edge" font-family="body" font-size="25" fill="#b8c1c5">Sampling SE: 0.78 percentage points</text><text x="55" y="730" dominant-baseline="text-before-edge" font-family="body" font-size="38" fill="#f3f0e8">Do not know</text><text x="620" y="730" dominant-baseline="text-before-edge" font-family="display" font-size="52" fill="#f3f0e8">13.9%</text><rect x="55" y="800" width="790" height="12" fill="#43535c"/><rect x="55" y="800" width="110" height="12" fill="#b8c1c5"/><text x="55" y="829" dominant-baseline="text-before-edge" font-family="body" font-size="25" fill="#b8c1c5">Sampling SE: 0.27 percentage points</text><text x="55" y="915" dominant-baseline="text-before-edge" font-family="mono" font-size="30" fill="#f3f0e8">REFERENCE: 5–18 OCT 2026</text><text x="55" y="965" dominant-baseline="text-before-edge" font-family="body" font-size="28" fill="#b8c1c5">Released 5 Nov · Census Bureau BTOS</text><text x="55" y="1020" dominant-baseline="text-before-edge" font-family="body" font-size="29" fill="#f3f0e8">Business reports. Work performed unmeasured.</text></svg>
