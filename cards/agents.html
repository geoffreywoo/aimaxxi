<style>
  :root{--bg:#050505;--ink:#f4f4f0;--mut:rgba(244,244,240,.55);--line:rgba(244,244,240,.14);
    --d:'Anton',Impact,sans-serif;--b:'Archivo',Helvetica,Arial,sans-serif;--m:'Space Mono','Courier New',monospace}
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--b);-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:72px 24px 80px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
    font-family:var(--d);font-size:19px;letter-spacing:.06em;margin-bottom:48px}
  .brand img{height:28px;width:auto}
  .kicker{font-family:var(--m);font-size:11px;letter-spacing:.34em;color:var(--mut);margin-bottom:16px}
  h1{font-family:var(--d);font-weight:400;font-size:clamp(44px,8vw,72px);letter-spacing:.005em;line-height:.95;margin-bottom:28px}
  img.card{width:100%;height:auto;display:block;border:1px solid rgba(244,244,240,.5);
    box-shadow:0 0 70px rgba(244,244,240,.08);filter:none}
  .line{margin-top:22px;font-size:16px;line-height:1.7;color:var(--mut)}
  .cta{margin-top:32px;display:flex;flex-wrap:wrap;gap:14px}
  .btn{font-family:var(--m);font-size:13px;font-weight:700;letter-spacing:.14em;padding:19px 40px;min-height:56px;
    text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn-solid{background:var(--ink);color:#000}
  .btn-ghost{border:1px solid rgba(244,244,240,.45);color:var(--ink)}
  footer{margin-top:56px;font-family:var(--m);font-size:11px;letter-spacing:.2em;color:var(--mut)}
  footer a{color:var(--ink);text-decoration:none}
  @media (max-width:640px){.cta{flex-direction:column}.btn{width:100%;padding:19px 20px}}

</style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><img src="../icon.png" alt="AI/MAXXI mark" />AI/MAXXI</a>
    <div class="kicker">AI/MAXXI ENLISTMENT ↗↗</div>
    <h1>MAXIMUM AGENTS</h1>
    <img class="card" src="agents.png" alt="AI/MAXXI enlistment card, maximum agents" />
    <p class="line">If it can be automated, automate it. If it can be scaled, scale it. Agents go zoom.</p>
    <div class="cta">
      <a class="btn btn-solid" href="/#enlist?p=agents">ENLIST YOURS ↗</a>
      <a class="btn btn-ghost" href="https://jup.ag/swap/SOL-5CQREYZGJQBTBGLVKM1VN9GDGFBWZCAC6TDPRBWZVVJL" target="_blank" rel="noopener">BUY ↗</a>
    </div>
    <footer><a href="/">aimaxxi.com</a> ↗ no brakes. no ceilings.</footer>
  </div>
</body>
</html>
