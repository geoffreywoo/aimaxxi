<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#172d32"><text x="56" y="80" font-size="20" font-weight="400">AI/MAXXI · ANTI HUNTER</text><text x="56" y="170" font-size="64" font-weight="700">ONCE OR</text><text x="56" y="240" font-size="64" font-weight="700">EVERY TIME?</text><text x="56" y="310" font-size="24" font-weight="400">SAME ATTEMPTS. DIFFERENT QUESTION.</text><text x="56" y="395" font-size="19" font-weight="400">STIPULATED POOL · NO MODEL OUTPUTS</text><text x="56" y="445" font-size="30" font-weight="400">3 PASS + 2 FAIL</text><text x="56" y="495" font-size="24" font-weight="400">Choose 2 distinct attempts. Ten pairs.</text><text x="56" y="600" font-size="28" font-weight="400">AT LEAST ONE PASSES</text><text x="56" y="705" font-size="88" font-weight="700">9 / 10</text><text x="56" y="750" font-size="28" font-weight="400">90% of the pairs</text><text x="56" y="855" font-size="28" font-weight="400">BOTH PASS</text><text x="56" y="960" font-size="88" font-weight="700">3 / 10</text><text x="56" y="1005" font-size="28" font-weight="400">30% of the pairs</text><text x="56" y="1090" font-size="21" font-weight="400">Fixed-pool proportions, not future probabilities.</text><text x="56" y="1130" font-size="18" font-weight="400">HumanEval 2021 · tau-bench 2024 · Methods in article</text></g><path d="M56 530H844M56 785H844M56 1040H844" stroke="#aab4b2" stroke-width="2"/></svg>