<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1560" viewBox="0 0 900 1560" role="img" aria-labelledby="title desc">
<title id="title">Two settings changed: a dated Gemini Apps energy comparison</title>
<desc id="desc">Google’s May 2025 aggregate estimates are 0.10 and 0.24 watt-hours per text prompt under different methods. The narrower method counts active accelerators and samples the most efficient ten percent of data centers. The comprehensive method includes the serving stack across the fleet. The ratio includes both changes, so it does not isolate overhead alone. Source: Google paper section 3.2 and Table 1, August 2025. Provider-authored historical study, not a current measurement or independent replication.</desc>
